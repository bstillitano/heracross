buildscript {
  ext.getExtOrDefault = { name, fallback ->
    rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
  }
}

apply plugin: "com.android.library"

// React Native 0.87 apps opt out of AGP 9's built-in Kotlin
// (android.builtInKotlin=false); apply the plugin only when nothing has yet.
if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

android {
  namespace "com.heracross"

  // Scizor is published from compileSdk 37 and cannot be consumed by less.
  compileSdkVersion getExtOrDefault("compileSdkVersion", 37)

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion", 24)
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  // Resolved from JitPack, which the React Native Gradle plugin adds to every
  // project by default (includeJitpackRepository=true).
  implementation "com.github.bstillitano:scizor:v0.2.2"
}
