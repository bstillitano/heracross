name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

# The workflow only reads the repository.
permissions:
  contents: read

# A new push to a pull request cancels its older runs. Every other run (pushes
# to main, merge queue checks) gets its own group, so each commit on main is
# checked and none is cancelled or left pending behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck files
        run: yarn typecheck

      # The React Native patch is kept twice, for patch-package users and for
      # this repository's Yarn resolution.
      - name: Check the React Native patches match
        run: node scripts/check-patches.js

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  # Turborepo caches only the Debug build of the example. Everything else runs
  # on every commit: the Release build and the unit tests aren't turbo tasks, so
  # a cache hit must not skip them.
  build-android:
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/android

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # Before the build, so JAVA_HOME in the turbo hash is this JDK.
      - name: Install JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache turborepo for Android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}-
            ${{ runner.os }}-turborepo-android-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

      # Release bundles the JavaScript with Hermes and builds the release
      # variant, which the Debug build above doesn't.
      - name: Build example for Android (Release)
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: yarn example build:android --mode Release

      - name: Run Android unit tests
        run: yarn test:android

  build-ios:
    runs-on: macos-latest

    env:
      # A version installed on the macos-latest (macOS 26 arm64) runner image:
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md#xcode
      XCODE_VERSION: '26.6'
      TURBO_CACHE_DIR: .turbo/ios

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use appropriate Xcode version
        id: xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # setup-xcode only runs xcode-select. Export DEVELOPER_DIR too, so the
      # turbo hash for build:ios changes with the Xcode that builds it.
      - name: Export DEVELOPER_DIR
        run: |
          echo "DEVELOPER_DIR=${{ steps.xcode.outputs.path }}/Contents/Developer" >> "$GITHUB_ENV"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for iOS
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}-
            ${{ runner.os }}-turborepo-ios-

      # Heracross is Swift Package Manager only: inject React Native's SPM
      # packages into the example project instead of installing pods.
      - name: Set up Swift Package Manager
        run: yarn example spm

      # `yarn example spm` rewrites the Xcode project, and the example's
      # scripts/relative-hermes-path.js makes HERMES_CLI_PATH relative again.
      # The committed project must be what those produce.
      - name: Check the committed Xcode project is up to date
        run: |
          if [ -n "$(git status --porcelain -- example/ios)" ]; then
            git status --short -- example/ios
            git diff -- example/ios
            echo "::error::yarn example spm changed example/ios. Run it locally and commit the result."
            exit 1
          fi

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"

      # Release compiles out Debug-only code, such as Scyther's test crash, so a
      # break there doesn't show up in the Debug build above.
      - name: Build example for iOS (Release)
        run: yarn example build:ios:release

      # Needs no SPM setup: HERACROSS_TESTS=1 resolves ios/Package.swift alone.
      - name: Run iOS unit tests
        run: yarn test:ios
