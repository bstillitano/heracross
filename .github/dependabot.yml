version: 2
updates:
  # GitHub Actions only. npm updates are left out on purpose: React Native is
  # pinned to the version the patch in patches/ and .yarn/patches/ is made for,
  # so bumping it (or packages that move with it) needs the patch regenerated by
  # hand. See "Updating React Native" in CONTRIBUTING.md.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
